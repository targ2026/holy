<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy sem mota há...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
        body {
            font-family: 'Space+Grotesk', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glow-effect {
            box-shadow: 0 0 50px -10px rgba(239, 68, 68, 0.25);
        }
        .card-glow {
            box-shadow: 0 4px 20px -2px rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-motorcycle text-red-500 text-2xl"></i>
            <span class="font-bold text-xl tracking-wider text-red-500">HOLY COUNTER</span>
        </div>
        <button onclick="shareLink()" class="px-4 py-2 bg-red-900/30 hover:bg-red-900/50 text-red-400 border border-red-800/50 rounded-lg font-medium text-sm transition-all flex items-center gap-2">
            <i class="fa-solid fa-share-nodes"></i> Partilhar
        </button>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto w-full flex-1 flex flex-col justify-center items-center text-center my-12">
        
        <!-- Icon Banner -->
        <div class="w-20 h-20 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center mb-8 glow-effect">
            <i class="fa-solid fa-person-walking text-red-500 text-3xl"></i>
        </div>

        <!-- Title -->
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-8">
            Holy sem mota há:
        </h1>

        <!-- Timer Grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 w-full max-w-2xl mb-8">
            <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6 flex flex-col justify-center items-center card-glow">
                <span id="days" class="text-5xl md:text-6xl font-black text-white">00</span>
                <span class="text-xs md:text-sm uppercase tracking-widest text-gray-400 font-semibold mt-2">Dias</span>
            </div>
            <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6 flex flex-col justify-center items-center card-glow">
                <span id="hours" class="text-5xl md:text-6xl font-black text-white">00</span>
                <span class="text-xs md:text-sm uppercase tracking-widest text-gray-400 font-semibold mt-2">Horas</span>
            </div>
            <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6 flex flex-col justify-center items-center card-glow">
                <span id="minutes" class="text-5xl md:text-6xl font-black text-white">00</span>
                <span class="text-xs md:text-sm uppercase tracking-widest text-gray-400 font-semibold mt-2">Minutos</span>
            </div>
            <div class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6 flex flex-col justify-center items-center card-glow">
                <span id="seconds" class="text-5xl md:text-6xl font-black text-red-500">00</span>
                <span class="text-xs md:text-sm uppercase tracking-widest text-gray-400 font-semibold mt-2">Segundos</span>
            </div>
        </div>

        <p class="text-gray-400 text-sm">
            Desde: <span id="startDateDisplay" class="font-medium text-gray-200">05 de maio de 2026 às 00:00</span>
        </p>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-xl border border-gray-700 hidden flex items-center gap-2">
        <i class="fa-solid fa-check text-green-400"></i>
        <span>Link copiado para a área de transferência!</span>
    </div>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-gray-600 text-xs py-4">
        Holy sem mota © 2026
    </footer>

    <script>
        // Limpa qualquer cache antiga do navegador
        localStorage.removeItem('holyStartDate');

        // Data fixa: 05 de Maio de 2026 às 00:00:00 (mês 4 no JavaScript pois Janeiro = 0)
        const startDate = new Date(2026, 4, 5, 0, 0, 0);

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        function shareLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 3000);
            });
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
