<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Sem Mota</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Animação suave para os números */
        .number-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .number-card:hover {
            transform: translateY(-2px);
            border-color: rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">

    <header class="w-full max-w-5xl mx-auto p-4 sm:p-6 flex justify-between items-center z-10">
        <div class="flex items-center space-x-2 text-red-500 font-bold text-xl tracking-wider">
            <i class="fa-solid fa-motorcycle opacity-50"></i>
            <span>HOLY COUNTER</span>
        </div>
        
        <div>
            <!-- Botão de Partilha -->
            <button id="shareBtn" class="p-2.5 rounded-xl bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600 hover:text-white transition text-sm flex items-center space-x-2">
                <i class="fa-solid fa-share-nodes"></i>
                <span class="hidden sm:inline">Partilhar</span>
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col justify-center items-center px-4 py-8 text-center relative overflow-hidden">
        <!-- Efeito de luz ao fundo -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-600/10 rounded-full blur-3xl -z-10 pointer-events-none"></div>

        <div class="max-w-4xl mx-auto w-full">
            <!-- Ícone Principal -->
            <div class="inline-flex items-center justify-center p-4 bg-red-500/10 border border-red-500/20 rounded-2xl mb-6 text-red-500 text-3xl sm:text-4xl">
                <i class="fa-solid fa-person-walking"></i>
            </div>

            <!-- Título Principal -->
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-tight text-slate-100 mb-8 sm:mb-12">
                Holy sem mota há:
            </h1>

            <!-- Grid do Contador -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-6 mb-10 w-full max-w-3xl mx-auto">
                
                <!-- Card Dias -->
                <div class="number-card p-4 sm:p-6 rounded-2xl flex flex-col justify-center items-center">
                    <span id="days" class="text-4xl sm:text-6xl font-black tracking-tight text-white mb-1">00</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-400 uppercase tracking-widest">Dias</span>
                </div>

                <!-- Card Horas -->
                <div class="number-card p-4 sm:p-6 rounded-2xl flex flex-col justify-center items-center">
                    <span id="hours" class="text-4xl sm:text-6xl font-black tracking-tight text-white mb-1">00</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-400 uppercase tracking-widest">Horas</span>
                </div>

                <!-- Card Minutos -->
                <div class="number-card p-4 sm:p-6 rounded-2xl flex flex-col justify-center items-center">
                    <span id="minutes" class="text-4xl sm:text-6xl font-black tracking-tight text-white mb-1">00</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-400 uppercase tracking-widest">Minutos</span>
                </div>

                <!-- Card Segundos -->
                <div class="number-card p-4 sm:p-6 rounded-2xl flex flex-col justify-center items-center border-red-500/20">
                    <span id="seconds" class="text-4xl sm:text-6xl font-black tracking-tight text-red-500 mb-1">00</span>
                    <span class="text-xs sm:text-sm font-semibold text-slate-400 uppercase tracking-widest">Segundos</span>
                </div>

            </div>

            <!-- Data de Início Exibida -->
            <p class="text-slate-400 text-sm">
                Desde: <span id="startDateDisplay" class="text-slate-200 font-medium">31 de março de 2026 às 00:00</span>
            </p>
        </div>
    </main>

    <footer class="w-full max-w-5xl mx-auto p-4 sm:p-6 border-t border-slate-900 mt-8">
        <p class="text-center text-xs text-slate-600">Holy sem mota © <span id="year"></span></p>
    </footer>

    <script>
        // Data Fixa de Início: 31 de Março de 2026 às 00:00
        const START_DATE = new Date('2026-03-31T00:00:00');

        // Elementos do DOM
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const shareBtn = document.getElementById('shareBtn');

        // Definir ano atual no rodapé
        document.getElementById('year').textContent = new Date().getFullYear();

        // Atualizar o contador em tempo real
        function updateCounter() {
            const now = new Date();
            const diffMs = now - START_DATE;

            if (diffMs < 0) {
                daysEl.textContent = "00";
                hoursEl.textContent = "00";
                minutesEl.textContent = "00";
                secondsEl.textContent = "00";
                return;
            }

            const seconds = Math.floor((diffMs / 1000) % 60);
            const minutes = Math.floor((diffMs / (1000 * 60)) % 60);
            const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        // Partilhar / Copiar Link
        shareBtn.addEventListener('click', () => {
            const shareUrl = window.location.href;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareUrl).then(showShareSuccess);
            } else {
                const input = document.createElement('input');
                input.value = shareUrl;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showShareSuccess();
            }
        });
